name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_run:
    workflows:
      - Benchmarks
    types:
      - completed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Sync publishable benchmark summaries from bench-results
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin bench-results

          tmpdir="$(mktemp -d)"
          git archive --format=tar origin/bench-results history/latest | tar -xf - -C "$tmpdir"

          if [[ ! -f "$tmpdir/history/latest/index.json" ]]; then
            echo "::error::Missing history/latest/index.json on bench-results."
            exit 1
          fi

          rm -rf packages/site/static/data/summary
          mkdir -p packages/site/static/data/summary
          cp -R "$tmpdir/history/latest/." packages/site/static/data/summary/

      - name: Guard CinderX-baselined headline data
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("packages/site/static/data/summary")
          index_path = root / "index.json"
          if not index_path.exists():
              raise SystemExit("Missing summary index after bench-results sync.")

          index = json.loads(index_path.read_text(encoding="utf-8"))
          entries = index.get("entries", [])
          if not isinstance(entries, list) or not entries:
              raise SystemExit("No summary entries found for benchmark dashboard.")

          has_pyperf_entry = any(
              isinstance(entry, dict) and entry.get("suite") == "pyperformance"
              for entry in entries
          )
          if not has_pyperf_entry:
              raise SystemExit("Missing required pyperformance entry in index.json.")

          latest_path = root / "latest-pyperformance.json"
          if not latest_path.exists():
              raise SystemExit(f"Missing required summary file: {latest_path}")
          payload = json.loads(latest_path.read_text(encoding="utf-8"))
          if payload.get("suite") != "pyperformance":
              raise SystemExit(
                  f"Suite mismatch for {latest_path.name}: "
                  f"expected 'pyperformance', found '{payload.get('suite')}'."
              )

          baseline = payload.get("baseline_runtime")
          run_config = ((payload.get("metadata") or {}).get("run_config") or {})
          runtimes = payload.get("runtimes") or []
          has_cinderx_runtime = any(
              isinstance(item, dict)
              and item.get("runtime") == "cpython-cinderx"
              and item.get("executed") is True
              for item in runtimes
          )
          if baseline != "cpython-cinderx":
              raise SystemExit(
                  f"{latest_path.name} is not CinderX-baselined (baseline_runtime={baseline!r})."
              )
          if run_config.get("require_cinderx_baseline") is not True:
              raise SystemExit(
                  f"{latest_path.name} was not generated with require_cinderx_baseline=true."
              )
          if run_config.get("ci_mode") is True:
              raise SystemExit(f"{latest_path.name} is CI-mode and not publishable headline data.")
          pyperf_mode = run_config.get("pyperformance_mode")
          if pyperf_mode not in (None, "default"):
              raise SystemExit(
                  f"{latest_path.name} uses non-full pyperformance mode ({pyperf_mode!r})."
              )
          if not has_cinderx_runtime:
              raise SystemExit(
                  f"{latest_path.name} has no executed cpython-cinderx runtime entry."
              )
          allowed_runtimes = {"cpython", "cpython-cinderx", "pypy"}
          runtime_keys = {
              str(item.get("runtime"))
              for item in runtimes
              if isinstance(item, dict)
          }
          unsupported_runtime_rows = sorted(runtime_keys - allowed_runtimes)
          if unsupported_runtime_rows:
              raise SystemExit(
                  f"{latest_path.name} includes unsupported runtime rows: {', '.join(unsupported_runtime_rows)}."
              )
          benchmark_runtime_keys = {
              str(item.get("runtime"))
              for item in (payload.get("benchmarks") or [])
              if isinstance(item, dict)
          }
          unsupported_benchmark_rows = sorted(benchmark_runtime_keys - allowed_runtimes)
          if unsupported_benchmark_rows:
              raise SystemExit(
                  f"{latest_path.name} includes unsupported benchmark runtime rows: {', '.join(unsupported_benchmark_rows)}."
              )
          PY

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: pnpm -C packages/site install --frozen-lockfile

      - name: Build static site
        run: pnpm -C packages/site build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: packages/site/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

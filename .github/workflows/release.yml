name: Release Artifacts

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create/use (for example: v0.1.0)
        required: true
        type: string
      publish_notes:
        description: Generate GitHub release notes
        required: true
        default: true
        type: boolean
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build_python:
    name: Build Python Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          version: latest

      - name: Build wheel and sdist
        run: |
          uv python install 3.14
          uv venv --python 3.14 .venv
          uv build ./python --out-dir dist/python --sdist --wheel --clear

      - name: Upload Python dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/python/*

  build_site:
    name: Build Site Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.0

      - name: Install dependencies
        run: pnpm -C packages/site install --frozen-lockfile

      - name: Build site
        run: pnpm -C packages/site build

      - name: Package site bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/site
          bundle="cinderx-community-site-${GITHUB_SHA::7}.tar.gz"
          tar -czf "dist/site/${bundle}" -C packages/site build
          echo "bundle=${bundle}" >> "$GITHUB_OUTPUT"

      - name: Upload site bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist/site/*

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build_python
      - build_site

    steps:
      - name: Resolve release tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag_name="${GITHUB_REF_NAME}"
          else
            tag_name="${{ github.event.inputs.tag }}"
          fi
          if [[ "${tag_name}" != v* ]]; then
            tag_name="v${tag_name}"
          fi
          publish_notes="${{ github.event.inputs.publish_notes }}"
          if [[ -z "${publish_notes}" ]]; then
            publish_notes="true"
          fi
          echo "tag_name=${tag_name}" >> "$GITHUB_OUTPUT"
          echo "generate_release_notes=${publish_notes}" >> "$GITHUB_OUTPUT"

      - name: Download Python artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: release-assets/python-dist

      - name: Download site artifacts
        uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: release-assets/site-dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: ${{ steps.meta.outputs.generate_release_notes == 'true' }}
          files: |
            release-assets/python-dist/*
            release-assets/site-dist/*

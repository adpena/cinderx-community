name: Benchmarks

on:
  workflow_dispatch:
    inputs:
      run_pyperformance:
        description: Run pyperformance suite in addition to smoke
        required: false
        default: true
        type: boolean
  schedule:
    - cron: '0 8 * * 1'

permissions:
  contents: read

jobs:
  benchmark:
    name: Smoke + Optional PyPerformance (Diagnostics only)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          version: latest

      - name: Install tooling
        run: |
          uv python install 3.14
          uv venv --python 3.14 .venv
          uv pip install --python .venv/bin/python -e ./python[dev]
          uv pip install --python .venv/bin/python setuptools
          uv pip install --python .venv/bin/python pyperformance nuitka

      - name: Attempt CinderX install on hosted runner
        id: cinderx_install
        shell: bash
        run: |
          set +e
          uv pip install --python .venv/bin/python cinderx
          install_exit=$?
          set -e
          if [[ "$install_exit" -ne 0 ]]; then
            echo "::warning::Hosted CinderX install failed; workflow will run CI-shape mode."
            echo "installed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::group::Hosted CinderX diagnostics"
          uname -a || true
          cat /etc/os-release || true
          echo "ImageOS=${ImageOS:-unknown}"
          echo "ImageVersion=${ImageVersion:-unknown}"
          .venv/bin/python -VV || true
          .venv/bin/python - <<'PY' || true
          import importlib.util
          import platform
          import sys

          print(f"executable={sys.executable}")
          print(f"python={sys.version}")
          print(f"platform={platform.platform()}")
          print(f"libc={platform.libc_ver()}")
          spec = importlib.util.find_spec("cinderx")
          print(f"cinderx_spec={getattr(spec, 'origin', None)}")
          PY
          mapfile -t cinderx_so < <(find .venv -type f -name 'cinderx*.so' 2>/dev/null || true)
          for so_file in "${cinderx_so[@]}"; do
            echo "ldd for ${so_file}"
            ldd "${so_file}" || true
          done
          echo "::endgroup::"

          set +e
          has_module="$(.venv/bin/python - <<'PY'
          try:
              import cinderx  # noqa: F401
          except Exception:
              print("false")
          else:
              print("true")
          PY
          )"
          probe_exit=$?
          set -e
          if [[ "$probe_exit" -ne 0 ]]; then
            echo "::warning::CinderX import probe crashed/failed on hosted runner; falling back to CI-shape mode."
            echo "installed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "installed=$has_module" >> "$GITHUB_OUTPUT"
          if [[ "$has_module" == "true" ]]; then
            echo "::notice::Hosted runner CinderX install/import succeeded."
          else
            echo "::warning::CinderX package installed but import failed; falling back to CI-shape mode."
          fi

      - name: Resolve benchmark runtimes
        id: runtimes
        shell: bash
        run: |
          python_bin="$(.venv/bin/python - <<'PY'
          import sys
          print(sys.executable)
          PY
          )"
          cinderx_bin=""
          has_cinderx="false"
          if [[ -n "${CINDERX_PYTHON:-}" ]]; then
            cinderx_bin="${CINDERX_PYTHON}"
            has_cinderx="true"
            echo "::notice::Using CINDERX_PYTHON for CinderX-baselined comparison runs."
          elif [[ "${{ steps.cinderx_install.outputs.installed }}" == "true" ]]; then
            cinderx_bin="$python_bin"
            has_cinderx="true"
            echo "::notice::Hosted runner .venv Python appears CinderX-capable."
          else
            echo "::warning::No usable CinderX runtime found. Running CI-shape validation without CinderX comparison publication args."
          fi
          echo "python_bin=$python_bin" >> "$GITHUB_OUTPUT"
          echo "cinderx_bin=$cinderx_bin" >> "$GITHUB_OUTPUT"
          echo "has_cinderx=$has_cinderx" >> "$GITHUB_OUTPUT"

      - name: Diagnostics lane policy note
        run: |
          echo "::notice::This ubuntu-latest lane is diagnostics-only and never produces canonical publishable benchmark artifacts."

      - name: Run smoke suite
        run: |
          .venv/bin/cxc bench run \
            --suite smoke \
            --python "${{ steps.runtimes.outputs.python_bin }}" \
            --ci-mode \
            --out data/runs \
            --summary-out data/summary \
            --static-summary-out packages/site/static/data/summary

      - name: Run pyperformance suite
        if: ${{ github.event_name == 'schedule' || inputs.run_pyperformance == true }}
        run: |
          .venv/bin/cxc bench run \
            --suite pyperformance \
            --python "${{ steps.runtimes.outputs.python_bin }}" \
            --ci-mode \
            --out data/runs \
            --summary-out data/summary \
            --static-summary-out packages/site/static/data/summary

      - name: Export metadata dossier (smoke only)
        if: ${{ !(github.event_name == 'schedule' || inputs.run_pyperformance == true) }}
        run: |
          .venv/bin/cxc bench export-dossier \
            --summary-root data/summary \
            --output-root data/summary/reports \
            --require-suite smoke

      - name: Export metadata dossier (smoke + pyperformance)
        if: ${{ github.event_name == 'schedule' || inputs.run_pyperformance == true }}
        run: |
          .venv/bin/cxc bench export-dossier \
            --summary-root data/summary \
            --output-root data/summary/reports

      - name: Upload diagnostics CI-shape artifacts
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-artifacts-ci-shape-diagnostics
          path: |
            data/runs
            data/summary

  benchmark_pinned_publishable:
    name: Publishable CinderX Baseline (Pinned ubuntu-22.04 + CPython 3.14.0)
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pinned CPython
        uses: actions/setup-python@v6
        with:
          python-version: '3.14.0'

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          version: latest

      - name: Install tooling
        run: |
          uv venv --python "$(command -v python)" .venv
          uv pip install --python .venv/bin/python -e ./python[dev]
          uv pip install --python .venv/bin/python setuptools
          uv pip install --python .venv/bin/python pyperformance nuitka

      - name: Install and verify CinderX baseline (strict)
        id: cinderx_strict
        shell: bash
        run: |
          uv pip install --python .venv/bin/python cinderx

          echo "::group::Pinned CinderX diagnostics"
          uname -a || true
          cat /etc/os-release || true
          echo "ImageOS=${ImageOS:-unknown}"
          echo "ImageVersion=${ImageVersion:-unknown}"
          .venv/bin/python -VV
          .venv/bin/python - <<'PY'
          import importlib.util
          import platform
          import sys

          print(f"executable={sys.executable}")
          print(f"python={sys.version}")
          print(f"platform={platform.platform()}")
          print(f"libc={platform.libc_ver()}")
          spec = importlib.util.find_spec("cinderx")
          print(f"cinderx_spec={getattr(spec, 'origin', None)}")
          PY
          mapfile -t cinderx_so < <(find .venv -type f -name 'cinderx*.so' 2>/dev/null || true)
          for so_file in "${cinderx_so[@]}"; do
            echo "ldd for ${so_file}"
            ldd "${so_file}" || true
          done
          echo "::endgroup::"

          set +e
          .venv/bin/python - <<'PY'
          import cinderx  # noqa: F401
          print("cinderx import probe succeeded")
          PY
          probe_exit=$?
          set -e
          if [[ "$probe_exit" -ne 0 ]]; then
            echo "::error::Pinned publishable job could not import CinderX. Aborting publishable baseline run."
            exit 1
          fi

          python_bin="$(.venv/bin/python - <<'PY'
          import sys
          print(sys.executable)
          PY
          )"
          echo "python_bin=$python_bin" >> "$GITHUB_OUTPUT"
          echo "cinderx_bin=$python_bin" >> "$GITHUB_OUTPUT"

      - name: Run smoke suite (publishable)
        run: |
          .venv/bin/cxc bench run \
            --suite smoke \
            --python "${{ steps.cinderx_strict.outputs.python_bin }}" \
            --cpython-cinderx "${{ steps.cinderx_strict.outputs.cinderx_bin }}" \
            --nuitka ".venv/bin/nuitka" \
            --require-cinderx-baseline \
            --ci-mode \
            --out data/runs \
            --summary-out data/summary \
            --static-summary-out packages/site/static/data/summary

      - name: Run pyperformance suite (publishable)
        if: ${{ github.event_name == 'schedule' || inputs.run_pyperformance == true }}
        run: |
          .venv/bin/cxc bench run \
            --suite pyperformance \
            --python "${{ steps.cinderx_strict.outputs.python_bin }}" \
            --cpython-cinderx "${{ steps.cinderx_strict.outputs.cinderx_bin }}" \
            --require-cinderx-baseline \
            --ci-mode \
            --out data/runs \
            --summary-out data/summary \
            --static-summary-out packages/site/static/data/summary

      - name: Verify publish guard (smoke only)
        if: ${{ !(github.event_name == 'schedule' || inputs.run_pyperformance == true) }}
        run: |
          .venv/bin/cxc bench verify-publish \
            --summary-root data/summary \
            --static-summary-root packages/site/static/data/summary \
            --require-suite smoke

      - name: Verify publish guard (smoke + pyperformance)
        if: ${{ github.event_name == 'schedule' || inputs.run_pyperformance == true }}
        run: |
          .venv/bin/cxc bench verify-publish \
            --summary-root data/summary \
            --static-summary-root packages/site/static/data/summary

      - name: Export metadata dossier (smoke only)
        if: ${{ !(github.event_name == 'schedule' || inputs.run_pyperformance == true) }}
        run: |
          .venv/bin/cxc bench export-dossier \
            --summary-root data/summary \
            --output-root data/summary/reports \
            --require-suite smoke

      - name: Export metadata dossier (smoke + pyperformance)
        if: ${{ github.event_name == 'schedule' || inputs.run_pyperformance == true }}
        run: |
          .venv/bin/cxc bench export-dossier \
            --summary-root data/summary \
            --output-root data/summary/reports

      - name: Upload publishable benchmark artifacts
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-artifacts-publishable-pinned
          path: |
            data/runs
            data/summary

  persist_publishable_history:
    name: Persist publishable history (bench-results branch)
    needs: benchmark_pinned_publishable
    if: ${{ needs.benchmark_pinned_publishable.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download pinned publishable artifacts
        uses: actions/download-artifact@v4
        with:
          name: benchmark-artifacts-publishable-pinned
          path: .cache/publishable-artifact

      - name: Persist summaries to bench-results branch
        env:
          HISTORY_BRANCH: bench-results
        shell: bash
        run: |
          set -euo pipefail

          summary_root=""
          if [[ -d ".cache/publishable-artifact/summary" ]]; then
            summary_root=".cache/publishable-artifact/summary"
          elif [[ -d ".cache/publishable-artifact/data/summary" ]]; then
            summary_root=".cache/publishable-artifact/data/summary"
          fi

          if [[ -z "$summary_root" ]]; then
            echo "::error::Could not locate summary directory in downloaded publishable artifact."
            find .cache/publishable-artifact -maxdepth 4 -type d || true
            exit 1
          fi

          recorded_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          run_slug="$(date -u +%Y%m%dT%H%M%SZ)-run${GITHUB_RUN_ID}"
          dest_summary_dir="history/runs/${run_slug}/summary"
          latest_dir="history/latest"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin "${HISTORY_BRANCH}" >/dev/null 2>&1; then
            git fetch origin "${HISTORY_BRANCH}:${HISTORY_BRANCH}"
            git checkout "${HISTORY_BRANCH}"
          else
            git checkout --orphan "${HISTORY_BRANCH}"
            git rm -rf . || true
          fi

          curated_summary_dir="$(mktemp -d)"

          smoke_run_id="$(jq -r '.run_id // empty' "${summary_root}/latest-smoke.json" 2>/dev/null || true)"
          pyperf_run_id="$(jq -r '.run_id // empty' "${summary_root}/latest-pyperformance.json" 2>/dev/null || true)"

          if [[ -f "${summary_root}/index.json" ]]; then
            jq \
              --arg updated_at "${recorded_at}" \
              --arg smoke_run_id "${smoke_run_id}" \
              --arg pyperf_run_id "${pyperf_run_id}" \
              '
              {
                updated_at_utc: $updated_at,
                entries: (
                  (.entries // [])
                  | map(
                      select(
                        ($smoke_run_id != "" and .run_id == $smoke_run_id)
                        or
                        ($pyperf_run_id != "" and .run_id == $pyperf_run_id)
                      )
                    )
                )
              }
              ' \
              "${summary_root}/index.json" > "${curated_summary_dir}/index.json"
          else
            cat > "${curated_summary_dir}/index.json" <<'JSON'
          {
            "updated_at_utc": "",
            "entries": []
          }
          JSON
          fi

          for latest_name in latest-smoke.json latest-pyperformance.json; do
            if [[ -f "${summary_root}/${latest_name}" ]]; then
              cp "${summary_root}/${latest_name}" "${curated_summary_dir}/${latest_name}"
            fi
          done

          mapfile -t selected_files < <(jq -r '.entries[]?.file // empty' "${curated_summary_dir}/index.json")
          for rel_path in "${selected_files[@]}"; do
            if [[ -f "${summary_root}/${rel_path}" ]]; then
              cp "${summary_root}/${rel_path}" "${curated_summary_dir}/${rel_path}"
            fi
          done

          if [[ -d "${summary_root}/reports" ]]; then
            mkdir -p "${curated_summary_dir}/reports"
            find "${summary_root}/reports" -maxdepth 1 -type f -name '*metadata-dossier.json' -exec cp {} "${curated_summary_dir}/reports/" \;
          fi

          mkdir -p "${dest_summary_dir}"
          cp -R "${curated_summary_dir}/." "${dest_summary_dir}/"

          rm -rf "${latest_dir}"
          mkdir -p "${latest_dir}"
          cp -R "${curated_summary_dir}/." "${latest_dir}/"

          manifest="history/index.json"
          if [[ ! -f "${manifest}" ]]; then
            cat > "${manifest}" <<'JSON'
          {
            "updated_at_utc": "",
            "entries": []
          }
          JSON
          fi

          tmp_manifest="$(mktemp)"
          jq \
            --arg updated_at "${recorded_at}" \
            --arg recorded_at "${recorded_at}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            --arg sha "${GITHUB_SHA}" \
            --arg ref "${GITHUB_REF_NAME}" \
            --arg suite_smoke "history/latest/latest-smoke.json" \
            --arg suite_pyperf "history/latest/latest-pyperformance.json" \
            --arg run_summary_dir "${dest_summary_dir}" \
            '
            .updated_at_utc = $updated_at
            | .entries = (
                [
                  {
                    recorded_at_utc: $recorded_at,
                    run_id: $run_id,
                    sha: $sha,
                    ref: $ref,
                    run_summary_dir: $run_summary_dir,
                    latest_smoke_path: $suite_smoke,
                    latest_pyperformance_path: $suite_pyperf
                  }
                ] + (.entries // [])
              )[:250]
            ' \
            "${manifest}" > "${tmp_manifest}"
          mv "${tmp_manifest}" "${manifest}"

          cat > history/README.md <<'MD'
          # Bench Results Branch

          This branch stores publishable benchmark summary history generated by
          `.github/workflows/benchmarks.yml` pinned CinderX-baselined runs.

          - `history/latest/`: latest publishable summary snapshots
          - `history/runs/<timestamp>-run<id>/summary/`: immutable per-run snapshots
          - `history/index.json`: compact manifest for trend ingestion
          MD

          git add history
          if git diff --cached --quiet; then
            echo "No history changes to commit."
            exit 0
          fi

          git commit -m "bench: persist publishable summaries for run ${GITHUB_RUN_ID}"
          git push origin "${HISTORY_BRANCH}"
